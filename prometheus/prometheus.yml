global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ArqWebV02 Backend - Spring Boot Actuator
  - job_name: 'arqwebv02-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['arqwebv02-backend:8080']

  # Cloudflared metrics
  - job_name: 'cloudflared'
    static_configs:
      - targets: ['172.17.0.1:2000']
    scrape_interval: 10s
    metrics_path: /metrics

  # Node Exporter (system metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s

  # Docker Engine metrics
  - job_name: 'docker'
    static_configs:
      - targets: ['172.17.0.1:9323']
    scrape_interval: 30s

  # PostgreSQL Database
  - job_name: 'arqwebv02-postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 60s
